name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify CHANGELOG.md was updated
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }} --depth=1
            BASE_SHA="origin/${{ github.base_ref }}"
            TARGET_SHA="HEAD"
          else
            BASE_SHA="${{ github.event.before }}"
            TARGET_SHA="${{ github.sha }}"
            if [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ] || [ -z "$BASE_SHA" ]; then
              BASE_SHA="HEAD~1"
            fi
            git fetch origin $BASE_SHA --depth=1 || true
          fi
          
          echo "Comparing $BASE_SHA against $TARGET_SHA"
          if ! git diff --name-only $BASE_SHA...$TARGET_SHA | grep -q 'CHANGELOG.md'; then
            echo "::error::CHANGELOG.md was not updated in this change! Please document your changes."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Extension
        run: npm run compile

      - name: Run Unit Tests
        run: npm run test
