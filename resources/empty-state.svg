<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <!-- Gradiente moderno ciano para azul real -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0072FF" />
    </linearGradient>
    
    <!-- Filtro de brilho neon para visual premium -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grade de fundo sutil (grid de engenharia/blueprint) -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="30" x2="300" y2="30" />
    <line x1="0" y1="60" x2="300" y2="60" />
    <line x1="0" y1="90" x2="300" y2="90" />
    <line x1="0" y1="120" x2="300" y2="120" />
    <line x1="0" y1="150" x2="300" y2="150" />
    <line x1="0" y1="180" x2="300" y2="180" />
    <line x1="0" y1="210" x2="300" y2="210" />
    <line x1="30" y1="0" x2="30" y2="240" />
    <line x1="60" y1="0" x2="60" y2="240" />
    <line x1="90" y1="0" x2="90" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="180" y1="0" x2="180" y2="240" />
    <line x1="210" y1="0" x2="210" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="270" y1="0" x2="270" y2="240" />
  </g>

  <!-- Conexões de circuito (Árvore lógica) -->
  <g fill="none" stroke="url(#grad)" stroke-linecap="round" filter="url(#glow)">
    <!-- Tronco principal -->
    <path d="M150,220 L150,140" stroke-width="4" />
    
    <!-- Ramificações nível 1 -->
    <path d="M150,140 Q150,110 90,110" stroke-width="3" />
    <path d="M150,140 Q150,110 210,110" stroke-width="3" />
    <path d="M150,140 L150,75" stroke-width="3" />
    
    <!-- Ramificações nível 2 (Esquerda) -->
    <path d="M90,110 Q90,85 50,85" stroke-width="2" />
    <path d="M90,110 Q90,85 115,85" stroke-width="2" />
    
    <!-- Ramificações nível 2 (Direita) -->
    <path d="M210,110 Q210,85 185,85" stroke-width="2" />
    <path d="M210,110 Q210,85 250,85" stroke-width="2" />
  </g>

  <!-- Elementos de Nós e Pastas -->
  <g fill="#1A1A24" stroke="url(#grad)" stroke-width="2">
    <!-- Pasta Raiz (Base) -->
    <rect x="135" y="195" width="30" height="22" rx="3" />
    <path d="M135,200 L145,200 L148,204 L165,204" fill="none" />
    
    <!-- Nós Nível 1 -->
    <!-- Pasta Centro -->
    <rect x="138" y="65" width="24" height="18" rx="2.5" />
    <path d="M138,69 L146,69 L148,72 L162,72" fill="none" />

    <!-- Pasta Esquerda -->
    <rect x="78" y="101" width="24" height="18" rx="2.5" />
    <path d="M78,105 L86,105 L88,108 L102,108" fill="none" />

    <!-- Pasta Direita -->
    <rect x="198" y="101" width="24" height="18" rx="2.5" />
    <path d="M198,105 L206,105 L208,108 L222,108" fill="none" />
    
    <!-- Nós Folha Nível 2 -->
    <!-- Nós de arquivo menores -->
    <circle cx="50" cy="85" r="5" fill="#00F0FF" />
    <circle cx="115" cy="85" r="5" fill="#00F0FF" />
    <circle cx="185" cy="85" r="5" fill="#00F0FF" />
    <circle cx="250" cy="85" r="5" fill="#00F0FF" />
  </g>

  <!-- Decorações de Dados nos ramos (Pulsos de luz) -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="150" cy="170" r="3" />
    <circle cx="110" cy="110" r="2.5" />
    <circle cx="190" cy="110" r="2.5" />
    <circle cx="90" cy="95" r="2" />
    <circle cx="210" cy="95" r="2" />
  </g>
</svg>
