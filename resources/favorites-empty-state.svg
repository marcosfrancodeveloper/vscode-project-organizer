<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <!-- Gradiente moderno dourado para rosa/roxo para dar destaque aos favoritos -->
    <linearGradient id="grad-fav" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700" />
      <stop offset="50%" stop-color="#FF5E62" />
      <stop offset="100%" stop-color="#FF9966" />
    </linearGradient>
    
    <!-- Filtro de brilho neon -->
    <filter id="glow-fav" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Grade de fundo sutil (grid de blueprint) -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="30" x2="300" y2="30" />
    <line x1="0" y1="60" x2="300" y2="60" />
    <line x1="0" y1="90" x2="300" y2="90" />
    <line x1="0" y1="120" x2="300" y2="120" />
    <line x1="0" y1="150" x2="300" y2="150" />
    <line x1="0" y1="180" x2="300" y2="180" />
    <line x1="0" y1="210" x2="300" y2="210" />
    <line x1="30" y1="0" x2="30" y2="240" />
    <line x1="60" y1="0" x2="60" y2="240" />
    <line x1="90" y1="0" x2="90" y2="240" />
    <line x1="120" y1="0" x2="120" y2="240" />
    <line x1="150" y1="0" x2="150" y2="240" />
    <line x1="180" y1="0" x2="180" y2="240" />
    <line x1="210" y1="0" x2="210" y2="240" />
    <line x1="240" y1="0" x2="240" y2="240" />
    <line x1="270" y1="0" x2="270" y2="240" />
  </g>

  <!-- Linhas de constelação orbitando a estrela central -->
  <g fill="none" stroke="url(#grad-fav)" stroke-linecap="round" opacity="0.4" filter="url(#glow-fav)">
    <path d="M150,110 L80,70" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M150,110 L220,70" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M150,110 L100,160" stroke-width="1.5" stroke-dasharray="4,4" />
    <path d="M150,110 L200,160" stroke-width="1.5" stroke-dasharray="4,4" />
  </g>

  <!-- Orbitais (Anéis) -->
  <circle cx="150" cy="110" r="65" fill="none" stroke="url(#grad-fav)" stroke-dasharray="2,8" stroke-width="1" opacity="0.3" />
  <circle cx="150" cy="110" r="40" fill="none" stroke="url(#grad-fav)" stroke-dasharray="6,4" stroke-width="1" opacity="0.2" />

  <!-- Nós periféricos de projetos favoritos -->
  <g fill="#1A1A24" stroke="url(#grad-fav)" stroke-width="1.5">
    <!-- Projeto Favoritado Superior Esquerdo -->
    <circle cx="80" cy="70" r="12" />
    <path d="M76,68 L84,68" stroke="url(#grad-fav)" stroke-width="1" fill="none" />
    <circle cx="80" cy="73" r="2" fill="url(#grad-fav)" />

    <!-- Projeto Favoritado Superior Direito -->
    <circle cx="220" cy="70" r="12" />
    <path d="M216,68 L224,68" stroke="url(#grad-fav)" stroke-width="1" fill="none" />
    <circle cx="220" cy="73" r="2" fill="url(#grad-fav)" />

    <!-- Projeto Favoritado Inferior Esquerdo -->
    <circle cx="100" cy="160" r="10" />
    <circle cx="100" cy="160" r="2" fill="url(#grad-fav)" />

    <!-- Projeto Favoritado Inferior Direito -->
    <circle cx="200" cy="160" r="10" />
    <circle cx="200" cy="160" r="2" fill="url(#grad-fav)" />
  </g>

  <!-- Estrela Central com glow neon -->
  <g filter="url(#glow-fav)">
    <!-- Polígono da Estrela Central -->
    <path d="M150,82 L158,98 L176,101 L163,114 L166,132 L150,123 L134,132 L137,114 L124,101 L142,98 Z" fill="url(#grad-fav)" />
  </g>
</svg>
